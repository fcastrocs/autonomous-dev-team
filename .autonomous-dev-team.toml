# ==============================================================================
# AUTONOMOUS AGENT PROTOCOL CONFIGURATION
# Single source of truth for repository invariants and multi-provider models.
# Edit this file, then run `./sync.py` to regenerate provider-specific configs.
# ==============================================================================

schema_version = 2
active_provider = "all"  # "all" | "codex" | "claude" | "antigravity"

# ==============================================================================
# PROJECT INVARIANTS (Compiled into agent instructions to prevent hallucinations)
# ==============================================================================
[project]
name = "autonomous-dev-team"
description = "Multi-provider autonomous agent protocol and configuration engine for Codex, Claude Code, and Google Antigravity"

# Paths that agents are strictly forbidden from editing, copying, or diffing directly.
# Agents are instructed to exclude these from file searches and never propose edits to them.
forbidden_paths = [
  ".git/**",
  "__pycache__/**",
  ".codex/**",
  ".pytest_cache/**"
]

# Command to deterministically synchronize/build generated assets (replaces LLM asset editing).
build_sync_cmd = "python3 sync.py"

# Focused unit test command template.
# Agents interpolate {file} or {test_name} for narrow verification before handoff.
focused_test_cmd = "python3 -m unittest tests/test_sync.py"

# Broad verification suite command executed ONLY by verifier when new risk is introduced.
full_test_cmd = "python3 -m unittest discover tests"

# Build / compilation verification command (owned by verifier).
build_cmd = "python3 sync.py --check"

# ==============================================================================
# DETERMINISTIC VERIFICATION GATES
# Commands executed by sync.py --run-verify and Antigravity Stop hooks.
# ==============================================================================
[verify]
commands = [
  "python3 sync.py --check",
  "python3 -m unittest discover tests"
]

# ==============================================================================
# MODEL ALIASES
# Maps speed/capability tiers to provider-specific model IDs.
# ==============================================================================
[models]
fast = { codex = "gpt-6-luna", claude = "claude-haiku-5-5", antigravity = "gemini-3.8-flash" }
balanced = { codex = "gpt-5.6-terra", claude = "claude-haiku-5-5", antigravity = "gemini-3.8-flash" }
deep = { codex = "gpt-6.1-sol", claude = "claude-sonnet-5-5", antigravity = "gemini-3.8-flash" }
ultra = { codex = "gpt-6-astra", claude = "claude-opus-5-5", antigravity = "gemini-3.8-flash" }

[reasoning_policy]
efforts = ["low", "medium", "high"]
max_repairs = 3

[reasoning_policy.providers.codex]
effort_delivery = "native"

[reasoning_policy.providers.claude]
effort_delivery = "advisory"

[reasoning_policy.providers.antigravity]
effort_delivery = "unsupported"

# ==============================================================================
# ROOT ORCHESTRATOR CONFIGURATION
# ==============================================================================
[orchestrator]
tier = "balanced"
reasoning_effort = "low"
plan_mode_reasoning_effort = "medium"
tool_output_token_limit = 6000
model_auto_compact_token_limit = 45000
model_auto_compact_token_limit_scope = "body_after_prefix"

# ==============================================================================
# SUBAGENTS ROSTER
# Single DRY definition of all active subagents across providers.
# ==============================================================================
[agents.architect]
description = "Read-only architect combining targeted fact discovery with 1–3 slice contract planning."
tier = "balanced"
reasoning_effort = "medium"
[agents.implementer]
description = "Primary implementer for surgical changes and cohesive features; verifies unit tests to green."
tier = "balanced"
reasoning_effort = "medium"
# Adaptive escalation: start on `tier`, step up only when a substantive blocker remains
# after targeted investigation; `ultra` only when the harder model is justified.
escalation = ["deep", "ultra"]
adaptive_steps = [
  { tier = "balanced", effort = "medium" },
  { tier = "balanced", effort = "high" },
  { tier = "deep", effort = "medium" },
  { tier = "ultra", effort = "medium", exceptional = true }
]

[agents.verifier]
description = "Independent verifier for full test suites, builds, regression risks, semantic contracts, and safety checks."
tier = "balanced"
reasoning_effort = "medium"
