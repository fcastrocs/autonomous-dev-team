# ==============================================================================
# AUTONOMOUS AGENT PROTOCOL CONFIGURATION
# Single source of truth for repository invariants and multi-provider models.
# Edit this file, then run `./sync.py` to regenerate provider-specific configs.
# ==============================================================================

active_provider = "all"  # "all" | "codex" | "claude" | "antigravity"

[schema]
name = "autonomous-dev-team"
version = 1

# ==============================================================================
# PROJECT INVARIANTS (Compiled into agent instructions to prevent hallucinations)
# ==============================================================================
[project]
name = "autonomous-dev-team"
description = "Multi-provider autonomous agent protocol and configuration engine for Codex, Claude Code, and Google Antigravity"

# Paths that agents are strictly forbidden from editing, copying, or diffing directly.
# Agents are instructed to exclude these from file searches and never propose edits to them.
forbidden_paths = [
  ".git/**",
  "__pycache__/**",
  ".codex/**",
  ".pytest_cache/**"
]

# Command to deterministically synchronize/build generated assets (replaces LLM asset editing).
build_sync_cmd = "python3 sync.py"

# Focused unit test command template.
# Agents interpolate {file} or {test_name} for narrow verification before handoff.
focused_test_cmd = "python3 -m unittest tests/test_sync.py"

# Broad verification suite command executed ONLY by code-validator when new risk is introduced.
full_test_cmd = "python3 -m unittest discover tests"

# Build / compilation verification command (owned by code-validator).
build_cmd = "python3 sync.py --check"


# ==============================================================================
# OPENAI / CODEX CONFIGURATION
# Generates .codex/config.toml, .codex/agents/*.toml, and .codex/prompts/*.md
# ==============================================================================
[codex.orchestrator]
model = "gpt-5.6-sol"
reasoning_effort = "low"
plan_mode_reasoning_effort = "medium"
tool_output_token_limit = 6000
model_auto_compact_token_limit = 45000
model_auto_compact_token_limit_scope = "body_after_prefix"

[codex.agents.code-explorer]
description = "Read-only repository scout for targeted discovery, producing structured Discovery Manifests."
model = "gpt-5.6-luna"
reasoning_effort = "low"

[codex.agents.planner]
description = "Repository-grounded engineering planner used ONLY for Tier 3 complex, architectural, or multi-subsystem changes."
model = "gpt-5.6-sol"
reasoning_effort = "medium"

[codex.agents.quick-implementer]
description = "Low-cost surgical implementer for small, mechanical, single-file, low-risk edits."
model = "gpt-5.6-luna"
reasoning_effort = "low"

[codex.agents.implementer]
description = "Primary implementer for substantive features, owning complete behavioral seams and verifying unit tests to green."
model = "gpt-5.6-sol"
reasoning_effort = "medium"

[codex.agents.diagnostician]
description = "Evidence-driven bug diagnostician that reproduces failures and returns a bounded root-cause manifest without editing files."
model = "gpt-5.6-terra"
reasoning_effort = "medium"

[codex.agents.code-validator]
description = "Independent verification runner for broad builds, integration suites, and cross-module checks. Validates new risk."
model = "gpt-5.6-terra"
reasoning_effort = "low"

[codex.agents.code-reviewer]
description = "Independent senior reviewer for high-risk diffs (lifecycle, concurrency, native bridges, public contracts, security)."
model = "gpt-5.6-terra"
reasoning_effort = "medium"

[codex.agents.commit-pusher]
description = "Deterministic Git publishing agent used only after an explicit user request. Non-interactive path staging."
model = "gpt-5.6-luna"
reasoning_effort = "low"

[codex.agents.harness-optimizer]
description = "Read-only evaluator of agent harnesses, prompts, routing, and context efficiency with evidence-backed recommendations."
model = "gpt-5.6-sol"
reasoning_effort = "medium"

[codex.agents.agent-evaluator]
description = "Independent evaluator of agent outputs against dispatch contracts, evidence, and completion quality."
model = "gpt-5.6-terra"
reasoning_effort = "medium"

[codex.agents.security-reviewer]
description = "Focused read-only security reviewer for trust boundaries, credentials, authorization, and unsafe data flows."
model = "gpt-5.6-terra"
reasoning_effort = "high"

[codex.agents.pr-test-analyzer]
description = "Read-only reviewer mapping changed behavior to meaningful tests and assessing assertions, edge paths, and flakiness risk."
model = "gpt-5.6-terra"
reasoning_effort = "medium"

[codex.agents.silent-failure-hunter]
description = "Read-only specialist for swallowed errors, false-success paths, missing propagation, and observability gaps."
model = "gpt-5.6-terra"
reasoning_effort = "medium"


